name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Deploy image to staging
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:latest to staging..."
          echo "IMAGE=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "ENVIRONMENT=staging" >> $GITHUB_STEP_SUMMARY
          # Add your OKD/kubectl rollout command here, e.g.:
          # kubectl set image deployment/en3-frontend en3-frontend=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Verify staging rollout
        run: |
          echo "Staging deployment complete."
          # kubectl rollout status deployment/en3-frontend --timeout=120s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # requires manual approval in GitHub repo settings

    steps:
      - name: Deploy image to production
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:latest to production..."
          # kubectl set image deployment/en3-frontend en3-frontend=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Verify production rollout
        run: |
          echo "Production deployment complete."
          # kubectl rollout status deployment/en3-frontend --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back to previous version..."
          # kubectl rollout undo deployment/en3-frontend