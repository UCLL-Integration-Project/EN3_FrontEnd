name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  sast:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config auto

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # Non-blocking: dev carries pre-existing lint debt that CI never ran
      # before (the workflow only triggered on main). Surface it without
      # failing the job; clean up the violations separately.
      - name: Run linter (if configured)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build application
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Generate SBOM
        run: |
          mkdir -p appendices
          npx @cyclonedx/cdxgen -t js -o appendices/fe-bom.json --json-pretty

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bom
          path: appendices/fe-bom.json

  docker-build:
    name: Build Docker Image (validation)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          push: false
          tags: en3-frontend:ci-${{ github.sha }}
