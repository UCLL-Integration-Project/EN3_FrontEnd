name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  sast:
    name: SAST Scan (Semgrep)
    runs-on: [self-hosted]
    # Non-blocking: if Semgrep can't run on this runner it won't stop the build
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pip (bootstrap) and Semgrep
        run: |
          # The school server ships Python without pip — bootstrap it from the
          # official installer (no root, no venv, no system packages needed).
          curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3 /tmp/get-pip.py --user --quiet
          ~/.local/bin/pip install --user --quiet semgrep
      - name: Run Semgrep
        run: ~/.local/bin/semgrep scan --config auto

  test:
    name: Run Tests
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # actions/setup-node installs Node on the self-hosted runner if it
      # is not already present (downloads to RUNNER_TOOL_CACHE).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # Non-blocking: dev carries pre-existing lint debt that CI never ran
      # before (the workflow only triggered on main). Surface it without
      # failing the job; clean up the violations separately.
      - name: Run linter (if configured)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build application
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Generate SBOM
        run: |
          mkdir -p appendices
          npx @cyclonedx/cdxgen -t js -o appendices/fe-bom.json --json-pretty

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bom
          path: appendices/fe-bom.json

